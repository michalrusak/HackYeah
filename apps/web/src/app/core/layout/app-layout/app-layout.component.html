<a class="skip-link" href="#main-content">{{
  "layout.skipToContent" | translate
}}</a>

<div class="layout">
  <mat-toolbar class="header">
    <a class="brand" routerLink="/">
      <mat-icon aria-hidden="true">hub</mat-icon>
      <span>{{ "matchmaking.productName" | translate }}</span>
    </a>

    <nav class="main-nav" [attr.aria-label]="'header.mainNav' | translate">
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              #link="routerLinkActive"
              [attr.aria-current]="link.isActive ? 'page' : null"
            >
              {{ item.labelKey | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="
        (theme.isDark() ? 'header.themeLight' : 'header.themeDark') | translate
      "
      (click)="theme.toggle()"
    >
      <mat-icon>{{ theme.isDark() ? "light_mode" : "dark_mode" }}</mat-icon>
    </button>
  </mat-toolbar>

  <main id="main-content" class="page-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
