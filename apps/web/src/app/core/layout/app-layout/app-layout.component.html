<div class="layout">
  <mat-toolbar class="header">
    <a class="brand" routerLink="/matchmaking">
      <mat-icon aria-hidden="true">travel_explore</mat-icon>
      <span>{{ "matchmaking.title" | translate }}</span>
    </a>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="
        (theme.isDark() ? 'header.themeLight' : 'header.themeDark') | translate
      "
      (click)="theme.toggle()"
    >
      <mat-icon>{{ theme.isDark() ? "light_mode" : "dark_mode" }}</mat-icon>
    </button>
  </mat-toolbar>
  <main class="page-content"><router-outlet /></main>
</div>
