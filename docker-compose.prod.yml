# Pełny stack produkcyjny: PostgreSQL + API (NestJS) + Web (nginx + Angular).
# Instrukcja: docs/DEPLOY.md
#
# Uruchomienie:
#   pnpm docker:prod:up
#   pnpm docker:prod:logs
#
# Aplikacja: http://localhost:50415 (lub DOCKER_WEB_PORT z .env)
# Health API: http://localhost:50415/api/health

services:
  postgres:
    image: postgres:17-alpine
    container_name: hackyeah-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackyeah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackyeah}
      POSTGRES_DB: ${POSTGRES_DB:-hackyeah}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hackyeah} -d ${POSTGRES_DB:-hackyeah}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hackyeah-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@postgres:5432/${POSTGRES_DB:-hackyeah}
      WEB_ORIGIN: ${DOCKER_WEB_ORIGIN:-http://localhost:50415}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.8-27b}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-google/gemini-2.5-flash-image-preview}
      KNOWLEDGE_ADMIN_PASSWORD_HASH: ${KNOWLEDGE_ADMIN_PASSWORD_HASH:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ROPS_NOTIFY_EMAIL: ${ROPS_NOTIFY_EMAIL:-}
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hackyeah-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_API_URL: ${WEB_API_URL:-/api}
    ports:
      - "${DOCKER_WEB_PORT:-50415}:80"

volumes:
  postgres_prod_data:
