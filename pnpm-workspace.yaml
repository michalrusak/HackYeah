packages:
  - "apps/*"
  - "packages/*"
# pnpm 11: bez tego install/start pada z ERR_PNPM_IGNORED_BUILDS.
# Nie uruchamiaj ręcznie `pnpm approve-builds` — lista jest w repo.
allowBuilds:
  esbuild: true
  workerd: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  "@prisma/adapter-pg": true
  "@nestjs/core": true
  "@parcel/watcher": true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - turbo@2.11.7
